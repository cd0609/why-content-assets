<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>why-carousel-1 screenshot slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
/>
<style>
  :root {
    --bg: #F7F5F1;
    --text: #14120F;
    --text-muted: #7A756C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1440px;
    background: var(--bg);
    overflow: hidden;
  }
  .slide {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 72px 64px 56px;
    color: var(--text);
  }
  .top-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .body-block {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 48px;
    text-align: center;
  }
  .headline {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: 56px;
    line-height: 1.1;
  }
  .subhead {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-style: italic;
    font-size: 30px;
    line-height: 1.4;
    color: var(--text-muted);
  }
  .notif-wrap {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    min-height: 0;
  }
  .arrives-caption {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .notification-card {
    width: 100%;
    max-width: 820px;
    background: #FFFFFF;
    border: 1px solid #E4E0D6;
    border-radius: 34px;
    box-shadow: 0 30px 70px rgba(20, 18, 15, 0.16);
    padding: 40px 40px 44px;
    text-align: left;
  }
  .notif-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
  }
  .notif-icon {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: #14120F;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .notif-icon span {
    font-family: 'Anton', sans-serif;
    color: #F7F5F1;
    font-size: 28px;
    line-height: 1;
  }
  .notif-app-name {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 28px;
    color: #14120F;
    flex: 1;
  }
  .notif-time {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 24px;
    color: #9A948A;
  }
  .notif-headline {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.3;
    color: #14120F;
    margin-bottom: 10px;
  }
  .notif-body {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 30px;
    line-height: 1.4;
    color: #4A463E;
  }
  .footer-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 36px;
  }
  .wordmark {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: 28px;
  }
  .swipe {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: var(--text);
    color: var(--bg);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 24px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 18px 32px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="top-row">
      <span>WHY</span>
      <span>4/4</span>
    </div>
    <div class="body-block">
      <div class="headline">WHY REMEMBERS FOR YOU.</div>
      <div class="subhead">Right before you’re about to do it again.</div>
    </div>
    <div class="notif-wrap">
      <div class="arrives-caption">Arrives Friday, 6:00pm</div>
      <div class="notification-card">
        <div class="notif-header">
          <div class="notif-icon"><span>W</span></div>
          <div class="notif-app-name">WHY</div>
          <div class="notif-time">now</div>
        </div>
        <div class="notif-headline">It’s Friday, 6pm.</div>
        <div class="notif-body">You said one more sick day and you’re done. Remember why.</div>
      </div>
    </div>
    <div class="footer-row">
      <span class="cta">try why</span>
    </div>
  </div>
</body>
</html>
