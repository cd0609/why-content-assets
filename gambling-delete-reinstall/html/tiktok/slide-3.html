<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>why-carousel-1 screenshot slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
/>
<style>
  :root {
    --bg: #F7F5F1;
    --text: #14120F;
    --text-muted: #7A756C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1440px;
    background: var(--bg);
    overflow: hidden;
  }
  .slide {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 72px 64px 56px;
    color: var(--text);
  }
  .top-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .body-block {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 48px;
    text-align: center;
  }
  .headline {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: 56px;
    line-height: 1.1;
  }
  .subhead {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-style: italic;
    font-size: 30px;
    line-height: 1.4;
    color: var(--text-muted);
  }
  .screenshot-frame {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 44px;
    min-height: 0;
  }
  .screenshot-frame img {
    max-width: 100%;
    max-height: 100%;
    border: 1px solid var(--text);
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(20, 18, 15, 0.18);
  }
  .footer-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 36px;
  }
  .wordmark {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: 28px;
  }
  .swipe {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: var(--text);
    color: var(--bg);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 24px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 18px 32px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="top-row">
      <span>WHY</span>
      <span>3/3</span>
    </div>
    <div class="body-block">
      <div class="headline">WHY REMEMBERS FOR YOU.</div>
      <div class="subhead">In your own words, right before you're about to do it again.</div>
    </div>
    <div class="screenshot-frame">
      <img src="file:///c:/Users/conno/Desktop/why/marketing-assets/screenshots/gambling/09-struggling.png" />
    </div>
    <div class="footer-row">
      <span class="cta">try why</span>
    </div>
  </div>
</body>
</html>
