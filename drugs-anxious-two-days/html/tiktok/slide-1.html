<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>why-carousel-1 photo slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1440px;
    overflow: hidden;
  }
  .slide {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .photo {
    position: absolute;
    top: -6px;
    right: -6px;
    bottom: -6px;
    left: -6px;
    width: calc(100% + 12px);
    height: calc(100% + 12px);
    object-fit: cover;
  }
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(20,18,15,0.15) 0%, rgba(20,18,15,0.15) 40%, rgba(20,18,15,0.82) 100%);
  }
  .content {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 80px 72px;
    color: #F7F5F1;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .body-block {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .headline {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: 48px;
    line-height: 1.08;
  }
  .subhead {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-style: italic;
    font-size: 32px;
    line-height: 1.4;
    max-width: 92%;
    opacity: 0.85;
  }
  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .wordmark {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: 28px;
  }
  .swipe {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="slide">
    <img class="photo" src="file:///C:/Users/conno/Desktop/OS/projects/why/marketing/carousels/drugs-anxious-two-days/sources/window-sill-dark.jpg" />
    <div class="scrim"></div>
    <div class="content">
      <div class="top-row">
        <span>WHY</span>
        <span>1/4</span>
      </div>
      <div class="body-block">
        <div class="headline">I’VE BEEN ANXIOUS FOR TWO DAYS AND I KNOW EXACTLY WHY.</div>
        <div class="subhead"></div>
      </div>
      <div class="footer-row">
        <span class="wordmark">WHY</span><span class="swipe">swipe &rarr;</span>
      </div>
    </div>
  </div>
</body>
</html>
